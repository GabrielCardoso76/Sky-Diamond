<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bloukemon</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/game.css}" />
</head>
<body>
    <h1>Bloukemon</h1>
    <div class="game-container">
        <div class="map">
            <div th:each="row, rowStat : ${map}" class="map-row">
                <div th:each="tile, colStat : ${row}"
                     th:classappend="${tile == 1 ? 'wall' : (tile == 2 ? 'tall-grass' : (tile == 3 ? 'water' : 'path'))} + ' ' + (${rowStat.index == playerY and colStat.index == playerX} ? 'player' : '')"
                     class="tile">
                </div>
            </div>
        </div>
        <div class="controls">
            <form id="move-form" th:action="@{/move}" method="post">
                <input type="hidden" id="direction-input" name="direction" value="">
                <button type="submit" onclick="setDirection('up')">Cima</button>
                <div class="middle-controls">
                    <button type="submit" onclick="setDirection('left')">Esquerda</button>
                    <button type="submit" onclick="setDirection('right')">Direita</button>
                </div>
                <button type="submit" onclick="setDirection('down')">Baixo</button>
            </form>
        </div>
    </div>

    <script>
        function setDirection(dir) {
            document.getElementById('direction-input').value = dir;
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key.toLowerCase();
            let direction = null;
            if (key === 'w') {
                direction = 'up';
            } else if (key === 'a') {
                direction = 'left';
            } else if (key === 's') {
                direction = 'down';
            } else if (key === 'd') {
                direction = 'right';
            }

            if (direction) {
                setDirection(direction);
                document.getElementById('move-form').submit();
            }
        });
    </script>
</body>
</html>
